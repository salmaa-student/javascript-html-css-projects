<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP - Exercice 4: Somme des temps</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .row { margin-bottom: 10px; }
        input { width: 60px; margin-right: 10px; }
        .total-box { background-color: #f0f0f0; padding: 10px; margin-top: 20px; display: inline-block;}
    </style>
</head>
<body>

    <h3>Entrer le premier temps :</h3>
    <div class="row">
        Heure(s) <input type="number" id="h1" value="0">
        Minute(s) <input type="number" id="m1" value="0">
        Seconde(s) <input type="number" id="s1" value="0">
    </div>

    <h3>Entrer le Deuxième temps :</h3>
    <div class="row">
        Heure(s) <input type="number" id="h2" value="0">
        Minute(s) <input type="number" id="m2" value="0">
        Seconde(s) <input type="number" id="s2" value="0">
    </div>

    <h3>Entrer le troisième temps :</h3>
    <div class="row">
        Heure(s) <input type="number" id="h3" value="0">
        Minute(s) <input type="number" id="m3" value="0">
        Seconde(s) <input type="number" id="s3" value="0">
    </div>

    <div class="total-box">
        <h3>Total des trois temps :</h3>
        Jour(s) <input type="text" id="resJ" readonly>
        Heure(s) <input type="text" id="resH" readonly>
        Minute(s) <input type="text" id="resM" readonly>
        Seconde(s) <input type="text" id="resS" readonly>
    </div>

    <br><br>
    <button onclick="calculerSomme()">Somme</button>
    <button onclick="effacer()">Effacer</button>

    <script src="monscrript4.js">
        function calculerSomme() {
    
            let h1 = parseInt(document.getElementById("h1").value) || 0;
            let m1 = parseInt(document.getElementById("m1").value) || 0;
            let s1 = parseInt(document.getElementById("s1").value) || 0;

            let h2 = parseInt(document.getElementById("h2").value) || 0;
            let m2 = parseInt(document.getElementById("m2").value) || 0;
            let s2 = parseInt(document.getElementById("s2").value) || 0;

            let h3 = parseInt(document.getElementById("h3").value) || 0;
            let m3 = parseInt(document.getElementById("m3").value) || 0;
            let s3 = parseInt(document.getElementById("s3").value) || 0;

         
            let totalSecondes = (h1 * 3600 + m1 * 60 + s1) + 
                                (h2 * 3600 + m2 * 60 + s2) + 
                                (h3 * 3600 + m3 * 60 + s3);

        
            let jours = Math.floor(totalSecondes / 86400);
            let reste = totalSecondes % 86400;

          
            let heures = Math.floor(reste / 3600);
            reste = reste % 3600;

        
            let minutes = Math.floor(reste / 60);

          
            let secondes = reste % 60;

            document.getElementById("resJ").value = jours;
            document.getElementById("resH").value = heures;
            document.getElementById("resM").value = minutes;
            document.getElementById("resS").value = secondes;
        }

        function effacer() {
           
            document.querySelectorAll('input').forEach(input => input.value = '');
            
           
            document.getElementById("resJ").value = '';
            document.getElementById("resH").value = '';
            document.getElementById("resM").value = '';
            document.getElementById("resS").value = '';
        }
    </script>
</body>
</html>
