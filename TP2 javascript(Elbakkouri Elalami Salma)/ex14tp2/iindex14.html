<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice 14 - Drag and Drop</title>
    <link rel="stylesheet" href="style14.css">
</head>
<body>

    <h2>Drag and Drop Example</h2>

    <div class="container">
        <div class="box" id="sourceBox">
            <h3>A déplacer</h3>
            <div class="item" draggable="true" id="item1">Élément 1</div>
            <div class="item" draggable="true" id="item2">Élément 2</div>
            <div class="item" draggable="true" id="item3">Élément 3</div>
        </div>

        <div class="box dropzone" id="targetBox">
            <h3>Déposer ici</h3>
        </div>
    </div>

    <script src="script14.js"></script>
</body>
</html>
