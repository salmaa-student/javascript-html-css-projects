<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice 9 - To-do list</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 { text-align: center; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        #addBtn {
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #addBtn:hover { background-color: #27ae60; }

        ul { list-style-type: none; padding: 0; }
        
        li {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }

        .btn-supprimer {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-supprimer:hover { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ma To-Do List</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Ajouter une tâche...">
            <button id="addBtn">Ajouter</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script src="script9.js"></script>
</body>
</html>
